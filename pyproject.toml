[build-system]
requires = ["setuptools>=61"]

[project]
name = "web-of-marvel-characters"
version = "0.1.0"
description = "A database of Marvel characters and visualization tools."
requires-python = ">=3.13"
scripts = { web-of-marvel-characters = "web_of_marvel_characters.main:main" }
dependencies = [
    "beautifulsoup4>=4.15.0",
    "networkx>=3.7",
    "numpy>=2.5.4",
    "pandas>=3.0.6",
    "python-louvain>=0.16",
    "pyvis>=0.3.2",
    "requests>=2.34.2",
    "tqdm>=4.70.1",
]

[dependency-groups]
dev = [
    "jupyter>=1.1.1",
    "matplotlib>=3.11.2",
]
